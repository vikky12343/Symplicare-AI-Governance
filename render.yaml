# Render blueprint: the API and the web app.
#
# Point Render at this file — Blueprints → New Blueprint Instance — rather than
# filling the fields in by hand, so the build and start commands cannot drift
# apart from the repository.
#
# The web app can be served from Vercel instead (see vercel.json); the two are
# alternatives, not a pair. Whichever serves it, the browser must reach the API
# through /api on the site's own origin: the session cookie is sameSite=strict,
# so a browser will only return it to the origin that set it.
services:
  - type: web
    name: symplicare-ai-governance-backend
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    healthCheckPath: /api/health
    # @cgi/core is a workspace package the API imports. It has to be compiled
    # before the API is compiled, and the API has to be compiled before it is
    # started — running the TypeScript sources with tsx in production is what
    # produced "Cannot find module @cgi/core/dist/index.js".
    buildCommand: npm ci && npm run build -w @cgi/core && npm run build -w @cgi/api
    startCommand: node apps/api/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # PORT is not listed: Render assigns one and the API reads it.
      # Set in the dashboard — a credential never belongs in a repository.
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: care_governance
      # Render generates one and keeps it. Nothing to paste, nothing to leak,
      # and it is not the value that has been sitting in a local .env file.
      - key: SESSION_SECRET
        generateValue: true
      # The site allowed to call this API. A public URL, so it lives here
      # rather than in the dashboard. CORS refuses every other origin, scheme
      # included and no trailing slash. Add more comma-separated if you put
      # the web app on Vercel as well.
      - key: WEB_ORIGIN
        value: https://symplicare-ai-governance-frontend.onrender.com
      - key: MAX_UPLOAD_BYTES
        value: "5242880"
      - key: LOG_LEVEL
        value: info
      # Evidence files live on the disk mounted below. Without this they are
      # written to the instance filesystem, which is wiped on every deploy.
      - key: STORAGE_DIR
        value: /var/data/evidence
      # Malware scanning. Deliberately left for the dashboard: the API refuses
      # to start in production on the placeholder scanner, and the point of
      # that refusal is that a person accepts it, not that a file does.
      #   CLAMAV_HOST=<host of a clamd instance>   what production wants
      #   SCANNER=heuristic-accepted-risk          accepting the placeholder
      - key: SCANNER
        sync: false
    disk:
      name: evidence
      mountPath: /var/data
      sizeGB: 5

  # ── The web app ────────────────────────────────────────────────
  # Static files, so there is no server to pay for and no runtime to patch.
  - type: web
    name: symplicare-ai-governance-frontend
    runtime: static
    region: frankfurt
    branch: main
    buildCommand: npm ci && npm run build -w @cgi/core && npm run build -w @cgi/web
    staticPublishPath: apps/web/dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      # Order matters — the first match wins, so the API proxy has to come
      # before the catch-all or every /api call would be answered with the
      # application's own index.html.
      - type: rewrite
        source: /api/*
        destination: https://symplicare-ai-governance-backend.onrender.com/api/*
      # Client-side routing: every other path is the single page.
      - type: rewrite
        source: /*
        destination: /index.html
