# The whole stack, the way it would run in production.
#
#   SESSION_SECRET=$(node -e "console.log(require('crypto').randomBytes(48).toString('base64url'))") \
#     docker compose -f docker-compose.prod.yml up --build
#
# The API is not published to the host: only nginx is reachable, and it proxies
# /api internally. That keeps the session cookie first-party and leaves one
# way in rather than two.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Real malware scanning. The API fails closed if this is unreachable, so the
  # stack depends on it being healthy before accepting uploads.
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: care_governance
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET before starting}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      LOG_LEVEL: info
    depends_on:
      mongo:
        condition: service_healthy
      clamav:
        condition: service_healthy
    volumes:
      - evidence:/app/.storage

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      - api

volumes:
  mongo-data:
  evidence:
